name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint and type-check
        run: |
          uv run ruff check src tests demo.py
          uv run ruff format --check src tests demo.py
          uv run mypy

      # No dataset download and no model: tests build their own programs and point the
      # data and results directories at empty folders.
      - name: Tests
        run: uv run pytest -q
